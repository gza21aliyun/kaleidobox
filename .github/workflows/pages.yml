name: Deploy version.json to Pages

# 将 sync/ 目录发布为 GitHub Pages 站点根，
# 使 https://<user>.github.io/<repo>/version.json 指向 sync/version.json。
on:
  push:
    branches:
      - kaleidobox
    paths:
      - "sync/version.json"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact (sync/ as site root)
        uses: actions/upload-pages-artifact@v3
        with:
          path: sync

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
